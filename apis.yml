apis:
- name: Salt AI Workflow Deployment API
  description: >-
    Deploy a Salt AI workflow as a production HTTP API. A POST to the deployment
    execution endpoint accepts a workflow_input map (per input node: value +
    value_type such as RAW) and an optional callback URL; it responds
    synchronously with an execution_id and delivers the workflow result
    asynchronously via a webhook POST to the supplied callback URL.
  humanURL: https://docs.salt.ai/deployments/api/
  baseURL: https://salt-api-dev.salt.ai
