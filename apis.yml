aid: plai-labs
name: Plai Labs
description: >-
  Plai Labs is the a16z-backed venture founded by ex-MySpace leaders Aber
  Whitcomb and Jim Benedetto (with Chris DeWolfe); its plailabs.com domain now
  redirects to Salt AI (salt.ai), the team's enterprise AI platform. Salt AI is
  a visual plus full-code AI workflow platform positioned as "Contextual AI for
  Regulated Enterprise" that deploys governed, auditable, model-agnostic AI
  workflows inside a customer's own infrastructure (behind the firewall, zero
  public data egress to external model providers, immutable audit trails) for
  life sciences, financial services, energy, and public-sector customers.
  Workflows built in the Salt visual builder can be deployed as production HTTP
  APIs that execute asynchronously and return their results via a webhook
  callback to a caller-supplied URL.
